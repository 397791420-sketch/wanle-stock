<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f2f4f8;--card:#fff;--ink:#1c2733;--sub:#6b7686;
  --line:#e6e9f0;--brand:#0f6bcb;--brand2:#5b3d8f;--gold:#b98d3e;
  --red:#d23a3a;--green:#1d9a5e;--radius:14px;
}
html{font-size:16px}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:40px}
button{font:inherit;border:none;background:none;cursor:pointer}
input{font:inherit}

/* ---------- 顶栏 ---------- */
.app-header{background:linear-gradient(135deg,#0f2b4c 0%,#14508c 100%);color:#fff;padding:20px 16px 14px}
.brand-row{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#f0c75e,#d99a2b);color:#5a3a05;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none;letter-spacing:1px}
.app-header h1{font-size:19px;font-weight:700;line-height:1.3}
.app-header .sub{font-size:12px;opacity:.85;margin-top:2px}
.meta{margin-top:12px;font-size:12px;background:rgba(255,255,255,.12);border-radius:10px;padding:7px 10px;display:inline-flex;gap:6px;flex-wrap:wrap}

/* ---------- 工具栏 ---------- */
.controls{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 12px}
.search-wrap{position:relative}
.search-wrap input{width:100%;height:40px;border:1px solid var(--line);border-radius:20px;background:#f5f7fb;padding:0 14px 0 38px;font-size:14px;outline:none}
.search-wrap input:focus{border-color:var(--brand);background:#fff}
.search-wrap::before{content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
.pills{display:flex;gap:8px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pills button{flex:none;padding:6px 14px;border-radius:16px;background:#eef1f6;color:#4a5568;font-size:13px;font-weight:600;white-space:nowrap}
.pills button.active{background:var(--brand);color:#fff}
.pills button.b-brand-卡萨帝.active{background:var(--brand2)}
.pills button.b-brand-统帅.active{background:#ff6a00}
.row-actions{display:flex;align-items:center;gap:8px;margin-top:9px}
.seg{display:flex;background:#eef1f6;border-radius:10px;padding:3px;flex:1}
.seg button{flex:1;padding:7px 0;border-radius:8px;font-size:13px;font-weight:600;color:#4a5568}
.seg button.active{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(20,40,80,.14)}
.seg button.active.dip-on{color:var(--red)}
.tiny-toggle{flex:none;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);background:#f5f7fb;border:1px solid var(--line);padding:6px 10px;border-radius:16px;font-weight:600}
.tiny-toggle.on{color:var(--red);border-color:#f0c4c4;background:#fdf2f2}
.result-bar{padding:10px 2px 2px;font-size:12px;color:var(--sub)}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border-radius:var(--radius);margin:10px 12px 0;overflow:hidden;box-shadow:0 1px 3px rgba(20,40,80,.06)}
.card-media{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#eef2f7;overflow:hidden}
.card-media img{width:100%;height:100%;object-fit:contain;display:block}
.media-ph{color:#8ea3bd;font-weight:700;letter-spacing:1px;font-size:15px}
.media-ph svg{width:74px;height:74px;display:block;margin:0 auto 4px;opacity:.55}
.badge{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;color:#fff;padding:3px 9px;border-radius:6px;letter-spacing:1px}
.badge.b-海尔{background:var(--brand)}
.badge.b-卡萨帝{background:var(--brand2)}
.badge.b-统帅{background:#ff6a00}
.stock-ribbon{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;background:rgba(255,255,255,.92);color:var(--green)}
.stock-ribbon.zero{color:#b0b7c3}
.card-body{padding:12px 14px 14px}
.model{font-size:16px;font-weight:700;word-break:break-all;line-height:1.35}
.sub{font-size:12px;color:var(--sub);margin-top:3px}
.row2{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap}
.size{font-size:12px;color:var(--sub);background:#f5f7fb;border:1px dashed #d7dee8;border-radius:8px;padding:4px 9px}
.size.filled{border-style:solid;border-color:#cfe3d8;background:#f0faf4;color:#1d6b45}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11px;color:#3c6aa5;background:#eef4fc;border:1px solid #d5e3f5;border-radius:6px;padding:3px 8px;line-height:1.5}
.price-area{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.price-main{font-size:22px;font-weight:800;color:var(--ink)}
.price-main .cur{font-size:12px;color:var(--sub);font-weight:600;margin-left:6px}
.price-main.dip-color{color:var(--red)}
.price-alt{margin-top:4px;font-size:12px;color:var(--sub)}
.price-alt b{color:#3c4a5d;font-weight:600}
.ask{color:var(--gold);font-weight:700}
.remark{margin-top:8px;font-size:12px;color:#a05a1c;background:#fdf6e9;border:1px solid #f3e2b8;border-radius:8px;padding:5px 9px;display:none}
.remark.show{display:block}

/* ---------- 列表视图 ---------- */
.view-list{display:block}
.view-list .card{margin:8px 12px 0;display:flex;align-items:center;gap:12px;padding:10px 12px}
.list-card .thumb{width:62px;height:62px;flex:none;border-radius:10px;background:#eef2f7;display:flex;align-items:center;justify-content:center;overflow:hidden}
.list-card .thumb img{width:100%;height:100%;object-fit:contain;display:block}
.list-card .thumb .media-ph{font-size:0}
.list-card .thumb .media-ph svg{width:38px;height:38px}
.list-card .lm{flex:1;min-width:0}
.list-card .model{font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge-mini{font-size:10px;font-weight:700;color:#fff;padding:2px 7px;border-radius:5px;flex:none;letter-spacing:.5px}
.badge-mini.b-海尔{background:var(--brand)}
.badge-mini.b-卡萨帝{background:var(--brand2)}
.badge-mini.b-统帅{background:#ff6a00}
.list-card .sub{margin-top:2px}
.list-card .row2{margin-top:5px}
.list-card .size{font-size:11px;padding:2px 7px}
.featline{font-size:11px;color:#3c6aa5;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-card .lp{flex:none;text-align:right;min-width:88px;padding-left:8px}
.list-card .price{font-size:17px;font-weight:800}
.list-card .price.dip-color{color:var(--red)}
.list-card .cur{font-size:11px;color:var(--sub);margin-top:1px}
.list-card .stock{font-size:11px;color:var(--green);margin-top:2px}
.list-card .stock.zero{color:#b0b7c3}
.result-row{display:flex;align-items:center;gap:8px;padding:10px 2px 2px}
.result-row .result-bar{padding:0;flex:1}
.view-seg{display:flex;background:#eef1f6;border-radius:10px;padding:3px;flex:none}
.view-seg button{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#4a5568;white-space:nowrap}
.view-seg button.active{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(20,40,80,.14)}

/* ---------- 库龄 ---------- */
.badge-age{display:inline-block;font-size:10px;font-weight:700;color:#fff;padding:2px 7px;border-radius:5px;margin-left:6px;letter-spacing:.5px;flex:none}
.badge-age.y{background:#e8a020}
.badge-age.o{background:#e8702a}
.badge-age.r{background:var(--red)}
.age-line{font-size:11px;color:#a05a1c;margin-top:4px;line-height:1.4}
.list-card .age-line{margin-top:2px;font-size:10px}
.age-line.age-dist{color:#c0854a;font-size:10px;margin-top:2px}
#agePills button.active{background:var(--gold)}
#ageSort.on{color:var(--gold);border-color:#ecd9b0;background:#fdf6e9}

/* ---------- 本月主推 ---------- */
.feat-wrap{background:linear-gradient(135deg,#6b420e 0%,#b98d3e 55%,#e8c25e 100%);color:#fff;padding:10px 12px 12px}
.feat-title{font-size:13px;font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.feat-title span{font-size:11px;font-weight:600;opacity:.85}
.feat-scroll{display:flex;gap:8px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.feat-scroll::-webkit-scrollbar{display:none}
.feat-tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.feat-tabs::-webkit-scrollbar{display:none}
.feat-tabs button{flex:none;padding:3px 12px;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;font-size:11px;font-weight:700}
.feat-tabs button.active{background:#fff;color:#7a4a12}
.feat-card .fc-cat{display:inline-block;font-size:8px;font-weight:700;color:#7a4a12;background:#f5d77a;border-radius:4px;padding:0 4px;margin-left:3px;flex:none}
.feat-card{flex:none;width:96px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.15);cursor:pointer}
.feat-card .fc-img{height:72px;background:#eef2f7;display:flex;align-items:center;justify-content:center;padding:4px}
.feat-card .fc-img img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.feat-card .fc-img .media-ph svg{width:34px;height:34px}
.feat-card .fc-bd{padding:4px 6px 6px}
.feat-card .fc-model{display:flex;align-items:center;gap:3px;font-size:9.5px}
.feat-card .fc-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;color:#1c2733}
.badge-fcat{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:#1d9a5e;padding:2px 7px;border-radius:5px;margin-left:6px;letter-spacing:.5px;flex:none}
.feat-card .fc-price{font-size:11px;font-weight:800;color:#c0392b;margin-top:2px}
.feat-card .fc-tag{font-size:8.5px;font-weight:700;color:#b98d3e;margin-left:3px}
.promo-line{font-size:12px;font-weight:800;color:#b98d3e;margin-top:3px}
.promo-mini{font-size:10.5px;font-weight:800;color:#b98d3e;margin-top:2px}
.fc-hb{font-size:9px;font-weight:700;color:#c0392b;margin-top:1px}
.fc-sub{font-size:8px;color:#8a6a2a;margin-top:1px}
.orig-line{font-size:11px;color:#9aa4b2;margin-top:2px}
.orig-line s{color:#c5ccd6}
.promo-mini.orig{color:#9aa4b2}
.hb-line{font-size:11px;font-weight:800;color:#c0392b;margin-top:2px}
.badge-feat{display:inline-block;font-size:10px;font-weight:800;color:#5a3a05;background:linear-gradient(135deg,#f5d77a,#e0a92e);padding:2px 7px;border-radius:5px;margin-left:6px;letter-spacing:.5px;flex:none}
#onlyFeat.on{color:#b98d3e;border-color:#ecd9b0;background:#fdf6e9}

/* ---------- 优先处理 ---------- */
.prio-wrap{background:linear-gradient(135deg,#7a1f1f 0%,#b5372a 55%,#d9534f 100%);color:#fff;padding:10px 12px 12px;margin-top:8px}
.prio-title{font-size:13px;font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.prio-title span{font-size:11px;font-weight:600;opacity:.85}
.prio-scroll{display:flex;gap:8px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.prio-scroll::-webkit-scrollbar{display:none}
.prio-tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.prio-tabs::-webkit-scrollbar{display:none}
.prio-tabs button{flex:none;padding:3px 12px;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;font-size:11px;font-weight:700}
.prio-tabs button.active{background:#fff;color:#7a1f1f}
.prio-card{flex:none;width:96px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.15);cursor:pointer}
.prio-card .fc-img{height:72px;background:#fdecea;display:flex;align-items:center;justify-content:center;padding:4px}
.prio-card .fc-img img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.prio-card .fc-img .media-ph svg{width:34px;height:34px}
.prio-card .fc-bd{padding:4px 6px 6px}
.prio-card .fc-model{display:flex;align-items:center;gap:3px;font-size:9.5px}
.prio-card .fc-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;color:#1c2733}
.prio-card .fc-cat{display:inline-block;font-size:8px;font-weight:700;color:#7a1f1f;background:#f5c6c0;border-radius:4px;padding:0 4px;margin-left:3px;flex:none}
.prio-card .fc-price{font-size:11px;font-weight:800;color:#c0392b;margin-top:2px}
.prio-card .fc-tag{font-size:8.5px;font-weight:700;color:#c0392b;margin-left:3px}
.prio-age{font-size:8.5px;font-weight:800;color:#7a1f1f;background:#fdecea;border:1px solid #e8b4ae;border-radius:4px;padding:0 4px;margin-top:2px;display:inline-block}
.prio-note{font-size:8px;color:#8a4a45;margin-top:1px}
.badge-prio{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:linear-gradient(135deg,#c0392b,#e74c3c);padding:2px 7px;border-radius:5px;margin-left:6px;letter-spacing:.5px;flex:none}
#onlyPrio.on{color:#c0392b;border-color:#f0c4bd;background:#fdf0ef}
/* ---------- 空态/页脚 ---------- */
.empty{padding:60px 20px;text-align:center;color:var(--sub);font-size:14px}
.footer{margin:28px 16px 0;font-size:11px;color:#9aa4b2;text-align:center;line-height:1.8}
@media (min-width:720px){
  .view-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0}
  .view-list{max-width:880px;margin:0 auto}
  .card{margin:10px 12px 0}
  body{padding-bottom:60px}
}
</style>

function num(n){ return (typeof n === 'number' && isFinite(n)) ? n : null; }
function fmt(n){ return n == null ? '' : Math.round(n).toLocaleString('zh-CN'); }
function yuan(n){ return n == null ? '' : '¥' + fmt(n); }

function ageInfo(p){
  const a = p && p.age;
  if(!a || !(a.qty>0)) return null;
  const d = a.max_days||0;
  const cls = d>=365 ? 'r' : (d>=180 ? 'o' : (d>=90 ? 'y' : ''));
  const label = d>=365 ? '超期' : (d>=180 ? '滞销' : (d>=90 ? '积压' : ''));
  return {cls:cls, label:label, days:d, earliest:a.earliest||'', unc:!!a.uncertain};
}
function ageBadgeHTML(p){
  const ai = ageInfo(p);
  if(!ai || !ai.label) return '';
  return '<span class="badge-age '+ai.cls+'">'+ai.label+'</span>';
}
function ageLineHTML(p){
  const a = p && p.age;
  if(!a || !(a.qty>0)) return '';
  const ai = ageInfo(p);
  const b = a.buckets||{};
  const groups=[];
  if(b.gt365>0) groups.push('一年以上 '+fmt(b.gt365)+'台');
  if(b.m181_365>0) groups.push('6-12月 '+fmt(b.m181_365)+'台');
  if(b.m91_180>0) groups.push('3-6月 '+fmt(b.m91_180)+'台');
  if(b.m61_90>0) groups.push('2-3月 '+fmt(b.m61_90)+'台');
  if(b.m31_60>0) groups.push('1-2月 '+fmt(b.m31_60)+'台');
  if(b.le30>0) groups.push('1月内 '+fmt(b.le30)+'台');
  const unc = ai.unc ? '（含期初估算）' : '';
  let h = '<div class="age-line">🕐 现存 '+fmt(a.qty)+' 台 · 最老 '+(ai.days||0)+' 天'+(ai.earliest?'（'+ai.earliest+' 入库）':'')+unc+'</div>';
  if(groups.length) h += '<div class="age-line age-dist">'+groups.join(' · ')+'</div>';
  return h;
}

function prodWidth(p){
  const sz = p && p.size;
  if(!sz) return null;
  const m = String(sz).match(/(\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[1]) : null;
}

function prodHeight(p){
  const sz = p && p.size;
  if(!sz) return null;
  const m = String(sz).match(/(\d+(?:\.\d+)?)\s*[xX*\u00d7]\s*(\d+(?:\.\d+)?)\s*[xX*\u00d7]\s*(\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[3]) : null;
}

function filtered(){
  const q = state.q.trim().toLowerCase();
  const list = PRODUCTS.filter(p=>{
    if(state.cat!=='all' && p.cat!==state.cat) return false;
    if(state.brand!=='all' && p.brand!==state.brand) return false;
    if(state.width!=='all'){
      const w = prodWidth(p);
      if(w==null) return false;
      if(state.width==='w50_60' && !(w>=500 && w<600)) return false;
      if(state.width==='w60_80' && !(w>=600 && w<800)) return false;
      if(state.width==='w80_90' && !(w>=800 && w<900)) return false;
      if(state.width==='w90p' && !(w>=900)) return false;
    }
    if(state.height!=='all'){
      const h = prodHeight(p);
      if(h==null) return false;
      if(state.height==='h170_180' && !(h>=1700 && h<1800)) return false;
      if(state.height==='h180_190' && !(h>=1800 && h<1900)) return false;
      if(state.height==='h190p' && !(h>=1900)) return false;
    }
    if(state.stockOnly && !(p.stock.total>0)) return false;
    if(state.featOnly && !p.feat) return false;
    if(state.prioOnly && !p.prio) return false;
    if(state.age!=='all'){
      const ai = ageInfo(p);
      if(!ai) return false;
      if(state.age==='jyd' && ai.days<90) return false;
      if(state.age==='zx' && ai.days<180) return false;
      if(state.age==='cq' && ai.days<365) return false;
    }
    if(q){
      const hay = (p.model+' '+p.sub+' '+p.brand+' '+p.cat+' '+(p.features||[]).join(' ')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(state.ageSort) list.sort((a,b)=>{
    const da=a.age?a.age.max_days:-1, db=b.age?b.age.max_days:-1;
    return db-da;
  });
  return list;
}

function mainPrice(p){
  const pr = p.price || {};
  if(state.mode==='retail'){
    const r=num(pr.retail);
    if(r!=null) return {v:r, label:'零售价'};
    return {v:num(pr.single), label:'参考价'};
  }
  if(state.mode==='wholesale') return {v:num(pr.wholesale), label:'批发价'};
  return {v:num(pr.single), label:'底价', dip:true};
}

    +'</div>'
    +'<div class="card-body">'
    +'<div class="model">'+p.model+ageBadgeHTML(p)+(p.feat?'<span class="badge-feat">主推</span>':'')+(p.prio?'<span class="badge-prio">优先处理</span>':'')+(p.fcat?'<span class="badge-fcat">'+(p.fcatLabel||p.fcat)+'</span>':'')+'</div>'
    +'<div class="sub">'+prName+' ｜ '+(total>0 ? ('海尔仓 '+fmt(st.haier)+' · 云仓 '+fmt(st.yun)) : '暂时无货')+'</div>'
    +ageLineHTML(p)
    +'<div class="row2">'+sizeHTML+'</div>'
    +featHTML
    +'<div class="price-area">'
    +'<div class="price-main'+priceCls+'">'+(m.v!=null ? yuan(m.v) : '<span class="ask">询价</span>')+'<span class="cur">'+m.label+'</span></div>'
    +(num(p.promo)!=null && num(pr.wholesale)!=null && num(p.promo)!==num(pr.wholesale)?'<div class="promo-line">批发价 <b>'+yuan(num(pr.wholesale))+'</b></div>':'')
    +(num(p.orig)!=null?'<div class="orig-line">原价 <s>'+yuan(num(p.orig))+'</s></div>':'')
    +(num(p.hb)!=null?'<div class="hb-line">🧧 红包 <b>'+yuan(num(p.hb))+'</b></div>':'')
    +'<div class="price-alt">'+alt+'</div>'
    +remHTML+prioN
    +'</div></div></div>';
}

function listCardHTML(p){
  const pr = p.price||{};
  const st = p.stock||{};
  const total = num(st.total)||0;
  let m = mainPrice(p);
  if(num(p.promo)!=null && !m.dip) m = {v:num(p.promo), label:p.promoTag||'国补价'};
  const prName = p.sub||p.cat;
  const sizeTxt = p.size ? '<span class="size filled">'+p.size+'</span>' : '<span class="size">尺寸待补充</span>';
  const featTxt = (p.features&&p.features.length) ? p.features.slice(0,2).join(' · ') : '';
  return '<div class="card list-card">'
    +'<div class="thumb">'+mediaHTML(p)+'</div>'
    +'<div class="lm">'
    +'<div class="model">'+p.model+'<span class="badge-mini b-'+p.brand+'">'+p.brand+'</span>'+ageBadgeHTML(p)+(p.feat?'<span class="badge-feat">主推</span>':'')+(p.prio?'<span class="badge-prio">优先处理</span>':'')+(p.fcat?'<span class="badge-fcat">'+(p.fcatLabel||p.fcat)+'</span>':'')+'</div>'
    +'<div class="sub">'+prName+' ｜ '+(total>0 ? ('海尔仓 '+fmt(st.haier)+' 台 · 云仓 '+fmt(st.yun)+' 台') : '暂时无货')+'</div>'
    +ageLineHTML(p)
    +'<div class="row2">'+sizeTxt+'</div>'
    +(featTxt ? '<div class="featline">'+featTxt+'</div>' : '')
    +(p.prioNote ? '<div class="featline">⚠️ '+p.prioNote+'</div>' : '')
    +'</div>'
    +'<div class="lp">'
    +'<div class="price'+(m.dip?' dip-color':'')+'">'+(m.v!=null ? yuan(m.v) : '<span class="ask">询价</span>')+'</div>'
    +'<div class="cur">'+m.label+'</div>'
    +(num(p.promo)!=null && num(pr.wholesale)!=null && num(p.promo)!==num(pr.wholesale)?'<div class="promo-mini">批发 '+yuan(num(pr.wholesale))+'</div>':'')
    +(num(p.orig)!=null?'<div class="promo-mini orig">原价 <s>'+yuan(num(p.orig))+'</s></div>':'')
    +(num(p.hb)!=null?'<div class="promo-mini">🧧 红包 '+yuan(num(p.hb))+'</div>':'')
    +(total>0 ? '<div class="stock">库存 '+fmt(total)+'</div>' : '<div class="stock zero">无货</div>')
    +'</div></div>';
}

function renderFeat(){
  const cats = ['冰箱','洗衣机','空调','厨电','洗干组合','中央空调'];
  let feats = PRODUCTS.filter(p=>p.feat && !p.comboSub);
  const catOf = p => p.fcatLabel || p.fcat;
  const present = cats.filter(c=>feats.some(p=>catOf(p)===c));
  const tabs = document.getElementById('featTabs');
  tabs.style.display = present.length>1 ? 'flex' : 'none';
  tabs.querySelectorAll('button[data-fcat]').forEach(b=>{
    b.style.display = (b.dataset.fcat==='all' || present.includes(b.dataset.fcat)) ? '' : 'none';
  });
  if(state.fcat!=='all' && !present.includes(state.fcat)) state.fcat='all';
  if(state.fcat!=='all') feats = feats.filter(p=>catOf(p)===state.fcat);
  feats.sort((a,b)=>(a.featOrder||0)-(b.featOrder||0));
  const wrap = document.getElementById('featWrap');
  if(!feats.length){ wrap.style.display='none'; return; }
  wrap.style.display='block';
  document.getElementById('featCount').textContent = '共 '+feats.length+' 款';
  document.getElementById('featScroll').innerHTML = feats.map(p=>{
    const promo = num(p.promo);
    const hb = num(p.hb);
    const orig = num(p.orig);
    const wsP = num((p.price||{}).wholesale);
    const w = promo!=null ? promo : wsP;
    const tag = promo!=null ? '国补价' : '批发价';
    let sub = '';
    if(promo!=null){
      if(wsP!=null && wsP!==promo) sub = '批发 ¥'+fmt(wsP);
      if(orig!=null) sub += (sub?' · ':'')+'原价 ¥'+fmt(orig);
    }
    const title = p.comboLabel || p.model;
    const hbLine = hb!=null ? '<div class="fc-hb">🧧 红包 ¥'+fmt(hb)+'</div>' : '';
    const subLine = sub ? '<div class="fc-sub">'+sub+'</div>' : '';
    return '<div class="feat-card" onclick="state.q=\''+p.model+'\';document.getElementById(\'search\').value=state.q;state.featOnly=false;refreshUI();">'
      +'<div class="fc-img">'+mediaHTML(p)+'</div>'
      +'<div class="fc-bd"><div class="fc-model"><span class="fc-name">'+title+'</span>'+(p.fcat?'<span class="fc-cat">'+(p.fcatLabel||p.fcat)+'</span>':'')+'</div>'
      +'<div class="fc-price">'+(w!=null?yuan(w):'询价')+'<span class="fc-tag">'+tag+'</span></div>'
      +subLine
      +hbLine
      +'</div></div>';
  }).join('');
}

function renderPrio(){
  const cats = ['冰箱','洗衣机','空调','厨电'];
  let prios = PRODUCTS.filter(p=>p.prio && !p.comboSub);
  const present = cats.filter(c=>prios.some(p=>p.fcat===c));
  const tabs = document.getElementById('prioTabs');
  tabs.style.display = present.length>1 ? 'flex' : 'none';
  tabs.querySelectorAll('button[data-pcat]').forEach(b=>{
    b.style.display = (b.dataset.pcat==='all' || present.includes(b.dataset.pcat)) ? '' : 'none';
  });
  if(state.pcat!=='all' && !present.includes(state.pcat)) state.pcat='all';
  if(state.pcat!=='all') prios = prios.filter(p=>p.fcat===state.pcat);
  prios.sort((a,b)=>(a.prioOrder||0)-(b.prioOrder||0));
  const wrap = document.getElementById('prioWrap');
  if(!prios.length){ wrap.style.display='none'; return; }
  wrap.style.display='block';
  document.getElementById('prioCount').textContent = '共 '+prios.length+' 款';
  document.getElementById('prioScroll').innerHTML = prios.map(p=>{
    const pp = num(p.prioPromo);
    const promo = pp!=null ? pp : num(p.promo);
    const hb = num(p.prioHb)!=null ? num(p.prioHb) : num(p.hb);
    const wsP = num((p.price||{}).wholesale);
    const w = promo!=null ? promo : wsP;
    const tag = pp!=null ? '清库价' : (p.promoTag || (promo!=null ? '国补价' : '批发价'));
    const ai = ageInfo(p);
    const ageTxt = ai ? '<div class="prio-age">🕐 库龄 '+ai.days+' 天'+(ai.earliest?' · '+ai.earliest:'')+'</div>' : '';
    const noteLine = p.prioNote ? '<div class="prio-note">'+p.prioNote+'</div>' : '';
    const hbLine = hb!=null ? '<div class="fc-hb">🧧 红包 ¥'+fmt(hb)+'</div>' : '';
    const title = p.comboLabel || p.model;
    return '<div class="prio-card" onclick="state.q=\''+p.model+'\';document.getElementById(\'search\').value=state.q;state.prioOnly=false;refreshUI();">'
      +'<div class="fc-img">'+mediaHTML(p)+'</div>'
      +'<div class="fc-bd"><div class="fc-model"><span class="fc-name">'+title+'</span>'+(p.fcat?'<span class="fc-cat">'+(p.fcatLabel||p.fcat)+'</span>':'')+'</div>'
      +'<div class="fc-price">'+(w!=null?yuan(w):'询价')+'<span class="fc-tag">'+tag+'</span></div>'
      +ageTxt
      +noteLine
      +hbLine
      +'</div></div>';
  }).join('');
}

function render(){
  renderFeat();
  renderPrio();
  const list = filtered();
  const el = document.getElementById('list');
  el.className = 'list view-' + state.view;
  el.innerHTML = list.map(state.view==='grid' ? cardHTML : listCardHTML).join('');
  document.getElementById('empty').style.display = list.length? 'none':'block';
  const total = list.reduce((a,p)=>a+(num(p.stock.total)||0),0);
  const tH = list.reduce((a,p)=>a+(num(p.stock.haier)||0),0);
  const tY = list.reduce((a,p)=>a+(num(p.stock.yun)||0),0);
  let ageText='';
  if(AGE_ENABLED){
    const jyd=list.filter(p=>{const a=p.age; return a && a.max_days>=90;}).length;
    const zx =list.filter(p=>{const a=p.age; return a && a.max_days>=180;}).length;
    const cq =list.filter(p=>{const a=p.age; return a && a.max_days>=365;}).length;
    ageText=' · 库龄≥90天 '+jyd+' 款 / ≥180天 '+zx+' 款 / ≥365天 '+cq+' 款';
  }
  document.getElementById('resultBar').textContent = '共 '+list.length+' 款 · 海尔仓 '+fmt(tH)+' 台 · 云仓 '+fmt(tY)+' 台'+ageText;
}

function refreshUI(){
  document.querySelectorAll('#catPills button').forEach(b=>b.classList.toggle('active', b.dataset.cat===state.cat));
  document.querySelectorAll('#brandPills [data-brand]').forEach(b=>b.classList.toggle('active', b.dataset.brand===state.brand));
  document.querySelectorAll('#widthPills button').forEach(b=>b.classList.toggle('active', b.dataset.width===state.width));
  document.querySelectorAll('#heightPills button').forEach(b=>b.classList.toggle('active', b.dataset.height===state.height));
  document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('active', b.dataset.mode===state.mode));
  document.getElementById('onlyStock').classList.toggle('on', state.stockOnly);
  document.getElementById('onlyFeat').classList.toggle('on', state.featOnly);
  document.getElementById('onlyPrio').classList.toggle('on', state.prioOnly);
  document.querySelectorAll('#featTabs button').forEach(b=>b.classList.toggle('active', b.dataset.fcat===state.fcat));
  document.querySelectorAll('#prioTabs button').forEach(b=>b.classList.toggle('active', b.dataset.pcat===state.pcat));
  document.querySelectorAll('#agePills [data-age]').forEach(b=>b.classList.toggle('active', b.dataset.age===state.age));
  document.getElementById('ageSort').classList.toggle('on', state.ageSort);
  document.querySelectorAll('.view-seg button').forEach(b=>b.classList.toggle('active', b.dataset.view===state.view));
  render();
}

document.getElementById('catPills').addEventListener('click', e=>{
  const b=e.target.closest('button[data-cat]'); if(!b) return;
  state.cat=b.dataset.cat; refreshUI();
});
document.getElementById('brandPills').addEventListener('click', e=>{
  const b=e.target.closest('button[data-brand]'); if(!b) return;
  state.brand=b.dataset.brand; refreshUI();
});
document.getElementById('widthPills').addEventListener('click', e=>{
  const b=e.target.closest('button[data-width]'); if(!b) return;
  state.width=b.dataset.width; refreshUI();
});
document.getElementById('heightPills').addEventListener('click', e=>{
  const b=e.target.closest('button[data-height]'); if(!b) return;
  state.height=b.dataset.height; refreshUI();
});
document.getElementById('onlyStock').addEventListener('click', ()=>{ state.stockOnly=!state.stockOnly; refreshUI(); });
document.getElementById('onlyFeat').addEventListener('click', ()=>{ state.featOnly=!state.featOnly; refreshUI(); });
document.getElementById('onlyPrio').addEventListener('click', ()=>{ state.prioOnly=!state.prioOnly; refreshUI(); });
document.getElementById('featTabs').addEventListener('click', e=>{
  const b=e.target.closest('button[data-fcat]'); if(!b) return;
  state.fcat=b.dataset.fcat; refreshUI();
});
document.getElementById('prioTabs').addEventListener('click', e=>{
  const b=e.target.closest('button[data-pcat]'); if(!b) return;
  state.pcat=b.dataset.pcat; refreshUI();
});
document.getElementById('agePills').addEventListener('click', e=>{
  const b=e.target.closest('button[data-age]');
  if(b){ state.age=b.dataset.age; refreshUI(); return; }
  if(e.target.closest('#ageSort')){ state.ageSort=!state.ageSort; refreshUI(); }
});
document.getElementById('modeSeg').addEventListener('click', e=>{
  const b=e.target.closest('button[data-mode]'); if(!b) return;
  state.mode=b.dataset.mode; refreshUI();
});
document.querySelector('.view-seg').addEventListener('click', e=>{
  const b=e.target.closest('button[data-view]'); if(!b) return;
  state.view=b.dataset.view;
  try{ localStorage.setItem('view', state.view); }catch(err){}
  refreshUI();
});
let t=null;
document.getElementById('search').addEventListener('input', e=>{
  clearTimeout(t);
  t=setTimeout(()=>{ state.q=e.target.value; render(); }, 120);
});

(function init(){
  try{ var sv=localStorage.getItem('view'); if(sv==='list'||sv==='grid') state.view=sv; }catch(e){}
  var qv=new URLSearchParams(location.search).get('view');
  if(qv==='list'||qv==='grid') state.view=qv;
  const dipBtn=document.getElementById('dipBtn');
  if(DIP_ENABLED){
    dipBtn.style.display='';
    dipBtn.addEventListener('click', ()=>{ state.dip=!state.dip; dipBtn.classList.toggle('dip-on', state.dip); refreshUI(); });
  }
  if(AGE_ENABLED){
    const agePills=document.getElementById('agePills');
    if(agePills) agePills.style.display='';
    const aUpd='2026-08-13 12:36:35';
    const aCut='2026-08-13';
    const elA=document.getElementById('statAge');
    if(elA){ elA.style.display=''; elA.textContent='库龄 '+(aUpd||'待更新'); }
    const elN=document.getElementById('ageNote');
    if(elN && aCut){ elN.style.display=''; }
  }
  if(DIP_ENABLED){
    const elS=document.getElementById('switchPub');
    if(elS) elS.style.display='';
  }
  const total=PRODUCTS.length;
  const stock=PRODUCTS.reduce((a,p)=>a+(num(p.stock.total)||0),0);
  const hStock=PRODUCTS.reduce((a,p)=>a+(num(p.stock.haier)||0),0);
  const yStock=PRODUCTS.reduce((a,p)=>a+(num(p.stock.yun)||0),0);
  document.getElementById('statTotal').textContent='共 '+total+' 款';
  document.getElementById('statStock').textContent='海尔仓 '+fmt(hStock)+' 台 · 云仓 '+fmt(yStock)+' 台';
  const hasPrio = PRODUCTS.some(p=>p.prio);
  document.getElementById('onlyPrio').style.display = hasPrio ? '' : 'none';
  refreshUI();
})();
</script>
</body>
</html>
